name: Create and publish the webapp server docker images
on:
  workflow_dispatch:
    inputs:
      targetRef:
        description: 'Tag, branch or commit from which to build the server image'
        default: ''
        required: true
        type: string
      imageTag:
        description: 'Tag to set when building the docker image (optional)'
        default: ''
        required: false
        type: string
      buildNumber:
        description: 'Build number to display in the Technical Information dialog (optional)'
        default: ''
        required: false
        type: string
  push:
    # List of branches that will trigger the workflow
    branches: ['main']
    tags:
      - '*'

env:
  LATEST_BRANCH: 'main'
  DOCKER_BUILDKIT: 1
  # Change the Container Registry information below if necessary
  REGISTRY: ghcr.io
  REPOSITORY_NAME: ${{ github.repository }}
  # Use workflow input "buildNumber" if provided, or the commit SHA otherwise
  VITE_BUILD_NUMBER: ${{ inputs.buildNumber != '' && inputs.buildNumber || github.sha }}
  # PUBLIC_URL is only required when building the server in instance-specific mode
  #PUBLIC_URL: /cosmotech-webapp/brewery

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for OIDC federation (chainguard-dev/setup-chainctl)

    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Use workflow input "targetRef" if provided, or the branch/commit/tag that triggered the job otherwise
          ref: ${{ inputs.targetRef != '' && inputs.targetRef || github.ref_name }}

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker pull token setup for chainguard images
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY_GH_WORKFLOW_MIGRATION }}

      # Webapp server image

      - name: "webapp-server: extract Docker metadata (tags, labels)"
        id: webapp-server-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # Change the tag and image name below if needed (see https://github.com/docker/metadata-action)
          flavor: |
            latest=false
          tags: |
            # set latest tag only for one branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', env.LATEST_BRANCH) }},priority=1200
            type=raw,value=${{ inputs.imageTag }},enable=${{ inputs.imageTag != '' }},priority=1100
            type=ref,event=branch
            type=ref,event=tag
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAME }}/webapp-server
      - name: "webapp-server: build and push Docker image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: webapp_server/webapp-server.Dockerfile
          push: true
          tags: ${{ steps.webapp-server-metadata.outputs.tags }}
          labels: ${{ steps.webapp-server-metadata.outputs.labels }}
          # Target stage can be either server-universal or server-specific (default)
          target: server-universal
          # PUBLIC_URL is only required when building the server in instance-specific mode
          build-args: |
            "VITE_BUILD_NUMBER=${{ env.VITE_BUILD_NUMBER }}"
          #  "PUBLIC_URL=${{ env.PUBLIC_URL }}"
      - name: "webapp-server: generate SBOM from Docker image"
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: 'ghcr.io/cosmo-tech/azure-sample-webapp/webapp-server:${{ github.ref_name }}'
          format: 'cyclonedx'
          output: 'sbom-webapp-server-docker.json'
      - name: "webapp-server: upload SBOM to DependencyTrack"
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        uses: DependencyTrack/gh-upload-sbom@95c2b5a810450509ef8a67e4f854b42d2ddf7fbf # v4
        with:
          serverhostname: ${{ secrets.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          apikey: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          project: 9d413789-1a24-4bd4-84c9-7466490d8885
          bomfilename: sbom-webapp-server-docker.json

      # Webapp functions image

      - name: "webapp-functions: extract Docker metadata (tags, labels)"
        id: webapp-functions-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # Change the tag and image name below if needed (see https://github.com/docker/metadata-action)
          flavor: |
            latest=false
          tags: |
            # set latest tag only for one branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', env.LATEST_BRANCH) }},priority=1200
            type=raw,value=${{ inputs.imageTag }},enable=${{ inputs.imageTag != '' }},priority=1100
            type=ref,event=branch
            type=ref,event=tag
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAME }}/webapp-functions
      - name: "webapp-functions: build and push Docker image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: api
          file: webapp_server/webapp-functions.Dockerfile
          push: true
          tags: ${{ steps.webapp-functions-metadata.outputs.tags }}
          labels: ${{ steps.webapp-functions-metadata.outputs.labels }}
      - name: "webapp-functions: generate SBOM from Docker image"
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: 'ghcr.io/cosmo-tech/azure-sample-webapp/webapp-functions:${{ github.ref_name }}'
          format: 'cyclonedx'
          output: 'sbom-webapp-functions-docker.json'
      - name: "webapp-functions: upload SBOM to DependencyTrack"
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        uses: DependencyTrack/gh-upload-sbom@95c2b5a810450509ef8a67e4f854b42d2ddf7fbf # v4
        with:
          serverhostname: ${{ secrets.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          apikey: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          project: c7aab7a5-87a2-4fe6-b665-128834d42f84
          bomfilename: sbom-webapp-functions-docker.json
