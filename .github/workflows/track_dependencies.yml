name: Track Dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-vanilla'

jobs:
  dependency_track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Generate SBOM
        run: yarn dlx -q @cyclonedx/yarn-plugin-cyclonedx -o sbom.json

      - name: Upload SBOM file (main)
        if: ${{ github.ref_type != 'tag' }}
        uses: DependencyTrack/gh-upload-sbom@v4
        with:
          serverhostname: ${{ secrets.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          apikey: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          project: a75e5d88-27ef-4f7a-8ce6-c3fb8aac8b17
          bomfilename: sbom.json

      - name: Upload SBOM file (tag)
        if: ${{ github.ref_type == 'tag' }}
        uses: DependencyTrack/gh-upload-sbom@v4
        with:
          serverhostname: ${{ secrets.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          apikey: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          projectname: azure-sample-webapp
          projectversion: ${{ github.ref_name }}
          parent: a75e5d88-27ef-4f7a-8ce6-c3fb8aac8b17
          autocreate: true
          bomfilename: sbom.json
