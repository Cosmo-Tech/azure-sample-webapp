name: Track Dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/on_premises_api_v4

jobs:
  dependency_track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'yarn'

      # Generate SBOM files

      - parallel:
        - name: Generate SBOM (webapp-server)
          run: yarn dlx -q @cyclonedx/yarn-plugin-cyclonedx -o sbom-webapp-server-dependencies.json
        - name: Generate SBOM (webapp-functions)
          working-directory: ./api
          run: yarn dlx -q @cyclonedx/yarn-plugin-cyclonedx -o ../sbom-webapp-functions-dependencies.json

      # Upload SBOM files

      - parallel:
        # Branch experimental/on_premises_api_v4
        - name: Upload SBOM files (experimental/on_premises_api_v4 - webapp-server)
          if: github.ref_name == 'experimental/on_premises_api_v4'
          uses: DependencyTrack/gh-upload-sbom@95c2b5a810450509ef8a67e4f854b42d2ddf7fbf # v4
          with:
            serverhostname: ${{ secrets.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
            apikey: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
            project: d09cc48f-5265-4694-be26-ea7474312a4a
            bomfilename: sbom-webapp-server-dependencies.json
        - name: Upload SBOM files (experimental/on_premises_api_v4 - webapp-functions)
          if: github.ref_name == 'experimental/on_premises_api_v4'
          uses: DependencyTrack/gh-upload-sbom@95c2b5a810450509ef8a67e4f854b42d2ddf7fbf # v4
          with:
            serverhostname: ${{ secrets.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
            apikey: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
            project: d07b3c26-9471-4c56-a1a4-056c1bc79374
            bomfilename: sbom-webapp-functions-dependencies.json
